name: Build and Release APK

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'res/**'
      - 'AndroidManifest.xml'
      - 'build.ps1'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android build tools
        shell: bash
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build APK
        shell: pwsh
        env:
          ANDROID_BUILD_TOOLS_VERSION: "34.0.0"
          ANDROID_PLATFORM: "android-34"
        run: ./build.ps1

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clustercast-apk
          path: out/ClusterCast.apk

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          tag="build-${short_sha}"
          apk_name="ClusterCast-${short_sha}.apk"
          cp out/ClusterCast.apk "$apk_name"
          gh release create "$tag" "$apk_name" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ClusterCast ${short_sha}" \
            --notes "仪表投屏 APK 构建"
